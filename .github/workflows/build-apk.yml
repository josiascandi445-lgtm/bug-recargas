name: Gerar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Chave fixa: assim cada APK novo instala POR CIMA do anterior
      # (e o SHA-1 para o login com Google nunca muda).
      - name: Usar a chave de assinatura fixa
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      - name: Instalar dependências
        run: npm install

      - name: Criar projeto Android
        run: npx cap add android

      # Só usado se ativares o login com Google (ver ATIVAR-GOOGLE.md)
      - name: Copiar google-services.json (se existir)
        run: |
          if [ -f google-services.json ]; then cp google-services.json android/app/google-services.json; fi

      - name: Gerar ícone e splash
        run: npx capacitor-assets generate --android

      - name: Sincronizar o site com o Android
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: bug-shop-recargas-apk
          path: android/app/build/outputs/apk/debug/*.apk
